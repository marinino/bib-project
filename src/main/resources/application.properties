spring.application.name=promptlib

spring.datasource.url=jdbc:postgresql://localhost:5432/promptlib
spring.datasource.username=promptlib
spring.datasource.password=promptlib

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SQL sichtbar machen + Query-Statistiken fuer die N+1-Untersuchung (Stufe 2.3)
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.generate_statistics=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# LLM-Adapter (Stufe 3). MockLlmClient ist aktiv, solange kein "real"-Profil laeuft -
# der API-Key kommt aus einer Umgebungsvariable, landet nie im Repo.
promptlib.llm.base-url=https://api.openai.com/v1
promptlib.llm.default-model=gpt-4o-mini
promptlib.llm.api-key=${LLM_API_KEY:}
promptlib.llm.connect-timeout-ms=5000
promptlib.llm.read-timeout-ms=15000
